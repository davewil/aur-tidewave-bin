name: Update AUR Package

on:
  schedule:
    # Check for new releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: overlapping runs would race to commit and push the same version
concurrency:
  group: update-aur
  cancel-in-progress: false

jobs:
  update:
    # A manual run from another branch must not publish that branch's PKGBUILD
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git openssh pacman-contrib jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # master's tip when the run starts, not the commit that triggered it, so a run
          # queued behind another sees the version that run just pushed
          ref: master

      - name: Check for new upstream release
        id: check
        env:
          # Authenticated requests avoid the 60/hour limit shared by runner IPs
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VER=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          # Fails on any API error rather than treating it as a new version ("null")
          LATEST_VER=$(sh scripts/latest-version.sh tidewave-ai/tidewave_app)

          echo "current=$CURRENT_VER" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_VER" >> "$GITHUB_OUTPUT"

          # Only a newer upstream release counts, so an older "latest" can't downgrade the package
          UPDATE=$(sh scripts/needs-update.sh "$CURRENT_VER" "$LATEST_VER")
          echo "update=$UPDATE" >> "$GITHUB_OUTPUT"

          if [ "$UPDATE" = true ]; then
            echo "New version available: $CURRENT_VER -> $LATEST_VER"
          else
            echo "Up to date: $CURRENT_VER (upstream latest: $LATEST_VER)"
          fi

      - name: Update PKGBUILD
        if: steps.check.outputs.update == 'true'
        run: |
          NEW_VER="${{ steps.check.outputs.latest }}"
          sed -i "s/^pkgver=.*/pkgver=$NEW_VER/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          # Update checksums (needs a non-root user for makepkg)
          useradd -m builder
          chown -R builder:builder .
          su builder -c "updpkgsums"
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

          # Restore ownership so subsequent steps can use git as root
          chown -R root:root .

      - name: Push to GitHub
        if: steps.check.outputs.update == 'true'
        run: |
          NEW_VER="${{ steps.check.outputs.latest }}"
          git config --global --add safe.directory "$PWD"
          git config user.name "David Williams"
          git config user.email "davewil1973@gmail.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update tidewave-bin to $NEW_VER"
          git push origin master

      # Runs on every successful run, not only on a version change, so a failed AUR
      # push is retried next run instead of stranded behind the GitHub commit.
      # sync-aur.sh pushes nothing when the AUR already matches and never downgrades it.
      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # Configure SSH for AUR, trusting only its pinned host keys
          mkdir -p /root/.ssh
          echo "$AUR_SSH_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          install -m 644 .github/aur_known_hosts /root/.ssh/known_hosts
          cat > /root/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile /root/.ssh/aur
            User aur
          EOF

          git config --global user.name "David Williams"
          git config --global user.email "davewil1973@gmail.com"

          sh scripts/sync-aur.sh ssh://aur@aur.archlinux.org/tidewave-bin.git
