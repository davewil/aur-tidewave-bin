name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Same image as the update job, so the scripts are tested under the sh and jq they run with
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git jq

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          status=0
          for t in tests/*.test.sh; do
            echo "== $t"
            sh "$t" || status=1
          done
          exit "$status"
